# Despliega la versión manual (sitio estático) en GitHub Pages.
#
# SE EJECUTA ÚNICAMENTE cuando un pull request hacia master se aprueba y se fusiona (event: pull_request_target "closed" con
# merged == true). NO se ejecuta al abrir/actualizar un PR, ni por push directo, ni manualmente. Como master está protegida
# (todo entra por PR), cada fusión aprobada a master es la única vía de publicación.
#
# Por qué pull_request_target y no pull_request: el entorno "github-pages" solo admite despliegues desde la rama por defecto
# (master). Con pull_request el run se asocia a refs/pull/N/merge y sería rechazado; con pull_request_target el run se asocia
# a master. Es seguro aquí porque el workflow siempre se lee desde master y solo actúa sobre código YA fusionado
# (merge_commit_sha), nunca sobre código de un PR sin fusionar.
#
# Requiere Settings → Pages → Source = "GitHub Actions" (ya habilitado).
name: Deploy to GitHub Pages

on:
  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Un solo despliegue a la vez, sin cancelar el que está en curso (los PR se fusionan de uno en uno).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Solo si el PR se FUSIONÓ (un PR cerrado sin fusionar no despliega nada).
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the merged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Assemble the site (only what the browser needs)
        run: |
          mkdir _site
          cp index.html core.js i18n.js _site/
          cp -r locales img _site/
          touch _site/.nojekyll

      - name: Validate the site
        run: |
          set -e
          for f in index.html core.js i18n.js locales/en.js locales/es.js \
                   img/niuzao.png img/yulon.webp img/chiji.png img/xuen.webp; do
            test -s "_site/$f" || { echo "::error::Missing file in the site: $f"; exit 1; }
          done
          # Every local <script src> and <img src> referenced by index.html must exist in the site
          grep -oE '(src)="[^"]+"' _site/index.html | cut -d'"' -f2 | grep -vE '^(https?:)?//|^data:' | sort -u | while read -r ref; do
            test -e "_site/$ref" || { echo "::error::index.html references a missing file: $ref"; exit 1; }
          done
          # The page must not contain credentials or private files
          ! find _site -name '.env*' -o -name 'tokens*' -o -name 'data' | grep . \
            || { echo "::error::Sensitive file found in the site"; exit 1; }
          echo "Site OK: $(find _site -type f | wc -l) files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publicar en Pages
      id-token: write   # verificar que el despliegue viene de este workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
